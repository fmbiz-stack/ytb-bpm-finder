name: Build macOS app

# Builds the downloadable Mac version. PyInstaller can't cross-compile, so a
# .app has to be built on a real Mac - this runner is that Mac.
#
# Apple Silicon only. A PyInstaller build is tied to its architecture, so an
# Intel .app would need an Intel runner, and GitHub has retired those - a
# macos-13 job sits queued forever rather than failing. Intel Macs can still
# run the toolkit from source (./start.command), which is architecture
# independent, or build their own .app with ./build_macos.sh.

on:
  push:
    branches: ["claude/**"]
    paths:
      - "bo2-emblem-toolkit/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      ARCH: apple-silicon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        working-directory: bo2-emblem-toolkit
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build
        working-directory: bo2-emblem-toolkit
        run: ./build_macos.sh

      - name: Package
        working-directory: bo2-emblem-toolkit
        # ditto, not zip: it preserves the bundle structure, symlinks and the
        # ad-hoc signature, which a plain zip mangles.
        run: |
          ditto -c -k --keepParent \
            dist/app/BO2EmblemToolkit.app \
            "BO2EmblemToolkit-${{ env.ARCH }}-app.zip"
          ditto -c -k --keepParent \
            dist/cli/BO2EmblemToolkit \
            "BO2EmblemToolkit-${{ env.ARCH }}-terminal.zip"

      - name: Smoke test the built binary
        working-directory: bo2-emblem-toolkit
        # Starts the real binary, checks the control panel answers, stops it.
        # Catches a build that assembles fine but can't actually run.
        run: |
          BO2_WEB_PORT=8390 BO2_PROXY_PORT=8380 \
          BO2_TOOLKIT_DATA_DIR="$RUNNER_TEMP/bo2data" \
            ./dist/cli/BO2EmblemToolkit &
          BUILD_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8390/api/status" >/dev/null 2>&1; then
              echo "control panel responded"
              curl -fsS "http://127.0.0.1:8390/api/status"
              kill $BUILD_PID
              exit 0
            fi
            sleep 1
          done
          echo "the built binary never answered on port 8390"
          kill $BUILD_PID 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: BO2EmblemToolkit-macOS-${{ env.ARCH }}
          path: bo2-emblem-toolkit/*.zip
          retention-days: 30
